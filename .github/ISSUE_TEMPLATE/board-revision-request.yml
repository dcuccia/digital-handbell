name: Board revision request
description: Propose a fix or feature for the next PCB revision (collected in the tracking issue; not a redesign authorization).
title: "Next board rev: "
labels: ["next-board-rev", "hardware"]
body:
  - type: markdown
    attributes:
      value: |
        Requests are collected in the pinned tracking issue (#19) and triaged at revision kickoff.
        See docs/hardware-revision-requests.md. Filing one does not authorize a redesign, routing spend or fabrication.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Fix (something on the current board is wrong or marginal)
        - Feature (a capability the board lacks)
        - Service, test or recovery access
        - Manufacturing / DFM / process
        - Mechanical interface (connector, mount, fit)
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request
      description: What should change, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Why: a bring-up observation (link the #9 record), a review finding (R1-R6), a measurement, or a capability gap.
        Name the board revision or snapshot hash it applies to. Say what is measured versus inferred.
    validations:
      required: true
  - type: input
    id: refs
    attributes:
      label: Affected references, nets or pins
      placeholder: "e.g. U3 STAT, GPIO24, R2/CHG0"
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change (optional)
      description: A starting point for review, not a selected design. Note alternatives if you know them.
  - type: textarea
    id: firmware
    attributes:
      label: Firmware impact
      description: New pins or behavior. Is the firmware already ready (profile entry only), or does it need work?
  - type: textarea
    id: mechanical
    attributes:
      label: Mechanical, assembly and cost impact
      description: Board area, height, connectors, extra parts or process steps.
  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      options:
        - Must (the next board is not useful without it)
        - Should (clear benefit, worth the cost)
        - Could (nice to have if cheap)
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How we would know it works
      description: The measurement or check that would close this request on the new board.
