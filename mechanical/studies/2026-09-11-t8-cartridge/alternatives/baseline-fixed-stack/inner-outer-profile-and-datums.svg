<text x="335" y="510" class="small">+z inward / handle above closure in actual instrument</text>
<text x="650" y="210" class="small">Blue: inside profile prioritized for fit</text>
<text x="650" y="234" class="small">Brown: +1.15 RADIAL offset, not normal wall thickness</text>
<text x="650" y="268" class="small">Raw OD73.15 at z0 and z4.9; OD51.50 at z14.9</text>
<text x="650" y="292" class="small">Working ODs73.98,72.05,52.30 respectively</text>
<text x="650" y="316" class="small">The disagreement is preserved, not reconciled by CAD.</text>
<text x="650" y="350" class="small">z4.9..14.9: provisional smooth monotone concave curve</text>
<text x="650" y="374" class="small">z14.9..41.75: straight interpolation assumption</text>
<text x="650" y="398" class="small">z41.75..45.55: unmeasured provisional final closure</text>
<text x="650" y="422" class="small">Handle exterior H85.5, D18.52 to D15.01; no interior claim</text>
<text x="25" y="570" class="small">Front flange D75.5 is EXTERNAL. Do not shrink it to mouth ID71.68.</text>
<text x="25" y="596" class="small">Register follows the inner working curve through z9, minus 0.3 radial PRINT ASSUMPTION.</text>
<text x="25" y="622" class="small">Speaker D40/H19; basket rear D32 at speaker z12; magnet D21.70/H7. Rim/vents/terminals remain unknown.</text>
<text x="25" y="648" class="small">Magnet opening D22.1: 0.40 diametral allowance, NOT a measured tolerance or interference fit.</text>
<text x="25" y="674" class="small">Service: unplug USB → remove two opposed shell screws → withdraw whole cartridge toward mouth (-z).</text>
<text x="25" y="700" class="small">The -Y USB slot is open all the way to the mouth. A closed side hole would trap the cartridge.</text>
<text x="25" y="726" class="small">M2 is 2 mm nominal thread, not M3. Board holes are D2.2; captive-nut pockets are hexagonal, not insert pilots.</text>
<text x="25" y="752" class="small">Four structural prints: body/grille/bezel, yoke, load-bearing battery cradle, removable battery cover.</text>
<text x="25" y="778" class="small">This is a dimensional/assembly screen. Raw BRep conflicts and unqualified insulation/retention gates remain in fit-report.json.</text>
</svg>
