<text x="28" y="219" class="small">MOUTH z0</text>
<text x="260" y="620" class="small">+z inward / toward handle</text>
<text x="40" y="655" class="small">Green: external front body; grey: speaker bound</text>
<text x="40" y="680" class="small">Blue: main PCB section; purple: full cell bound</text>
<text x="40" y="705" class="small">Inside blue curve / radial-offset brown outside curve</text>
<text x="715" y="125" class="small">MEASURED / INFERRED SHELL STATIONS</text>
<text x="715" y="152" class="small">z0: ID71.68 measured; z4.9: ID69.75 measured</text>
<text x="715" y="179" class="small">z14.9: ID50 rough measured; 10mm travel after z4.9</text>
<text x="715" y="206" class="small">z41.75 approximate: ID36.12 INFERRED from OD38.42</text>
<text x="715" y="233" class="small">Owner assumes1.15 radial wall; not normal thickness</text>
<text x="715" y="260" class="small">Raw OD73.15 /73.15 /51.50 are preserved</text>
<text x="715" y="287" class="small">Working OD73.98 /72.05 /52.30 do not all match raw OD</text>
<text x="715" y="314" class="small">Concave interpolation and final closure are provisional</text>
<text x="715" y="341" class="small"></text>
<text x="715" y="368" class="small">CHOSEN WORKING STACK (not new measurements)</text>
<text x="715" y="395" class="small">Entire internal stack moves 6.25mm toward mouth</text>
<text x="715" y="422" class="small">Speaker front z-6.25; grille front z-10.75</text>
<text x="715" y="449" class="small">PCB Fz14.25 / Bz15.85</text>
<text x="715" y="476" class="small">Cell axis z25.63; D16.4 x L34 remains provisional</text>
<text x="715" y="503" class="small">Plastic target 1; clearance 0.1</text>
<text x="715" y="530" class="small">Full guard-stock / shell gap 0.294mm</text>
<text x="715" y="557" class="small">Mouth register and shell-fastener locations stay fixed</text>
<text x="715" y="584" class="small">USB remains in a mouth-open -Y service slot</text>
<text x="715" y="611" class="small">Handle exterior H85.5; no usable interior assumed</text>
<text x="25" y="765" class="small">External flange D75.5; fixed register follows cavity to z9 with assumed 0.3 radial gap.</text>
<text x="25" y="790" class="small">Speaker D40/H19, rear basket D32 at speaker-relative z12, magnet D21.70/H7. Opening D22.1 is a0.4 diametral print allowance.</text>
<text x="25" y="815" class="small">Assemble outside bell: speaker -&gt; removable yoke -&gt; PCB/cradle -&gt; inert cell/cover. Never push the D40 speaker through the installed yoke.</text>
<text x="25" y="840" class="small">Service: unplug USB, remove both shell screws, withdraw the whole cartridge toward mouth. The side slot is open to z0, not a trapping closed hole.</text>
<text x="25" y="865" class="small">Four structural prints, ordinary M2x6 screws and captive nuts. M2 means2mm thread; PCB drills2.2mm, not M3 or unqualified heat-set pilots.</text>
<text x="25" y="890" class="small">Shell screws follow the modeled lip normal; all drilling is a template proposal only. No fabrication or physical shell modification was performed.</text>
<text x="25" y="915" class="small">Nominal BRep fit is not loaded-contact, cell-wrapper/button, vent, torque, print-tolerance, insulation, temperature or child-use approval.</text>
</svg>
