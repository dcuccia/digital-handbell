  <text x="1125" y="602" class="sub" text-anchor="middle">Brown: modeled physical conductive bases. Orange: 5 intentional process-via exceptions.</text>
  <text x="1125" y="622" class="sub" text-anchor="middle">New via-center exclusion = physical base +0.25 clearance +0.302 copper radius.</text>
  <text x="55" y="655" class="title" text-anchor="start">FRONT ENGINEERING INPUTS</text>
  <text x="55" y="682" class="legend" text-anchor="start">Board F z=25.0; B z=26.6. Speaker conservative D40 until z=16.5; D21.70 until z=23.5.</text>
  <text x="55" y="702" class="legend" text-anchor="start">Nominal central axial gap: 25.0−23.5=1.5 mm. No axial tolerance margin is implied.</text>
  <text x="55" y="722" class="legend" text-anchor="start">Manifest z=19.3 is a local planning station only; L1 z=20.0 gives 0.7 mm there, never universal clearance.</text>
  <text x="55" y="742" class="legend" text-anchor="start">Height classes (83 fitted): below 1.5 = 64; equal = 5; above = 14.</text>
  <text x="55" y="762" class="legend" text-anchor="start">Below 1.5 center region is only a nominal vertical speaker-screen pass; other gates remain.</text>
  <text x="775" y="655" class="title" text-anchor="start">REAR / GLOBAL LIMITATIONS</text>
  <text x="775" y="682" class="legend" text-anchor="start">PARTIAL contact map: loaded spring/ear motion and complete metal/service envelope pending.</text>
  <text x="775" y="702" class="legend" text-anchor="start">Mount rings show actual Ø2.2 holes only; screw-head/washer/tool envelopes pending.</text>
  <text x="775" y="722" class="legend" text-anchor="start">No moving proxies shown. Fixed red centers use exact native inventory poses; both panels are non-mirrored.</text>
  <text x="775" y="742" class="legend" text-anchor="start">All bounds, memberships, exact points, UUIDs, and incomplete-gate ledger are in the JSON report.</text>
  <text x="775" y="762" class="legend" text-anchor="start">Yoke BRep Zmax=25.0 and carrier reaches z=27; exact BRep slices/support/service projections remain pending.</text>
