  <path d="M1080 660 L1064.5 706.9" stroke="#8a3b12" stroke-width="2"/><circle cx="1064.5" cy="706.9" r="4" fill="#8a3b12"/>
  <text x="1000" y="650" class="call">goes in first</text>
  <text x="620" y="815" class="note">3.2 mm long, 0.8 mm wide. Gold-plated. Don't squeeze</text>
  <text x="620" y="840" class="note">or bend the spring box at the front.</text>
  <rect x="30" y="885" width="1140" height="110" rx="16" fill="#e2f1f2"/>
  <text x="55" y="922" class="label">D. Tools</text>
  <text x="55" y="955" class="note">Fine needle-nose pliers, flush cutters, red permanent marker, bright lamp (a phone camera at 2-3x helps),</text>
  <text x="55" y="980" class="note">fine soldering tip, flux, small heat-shrink, multimeter and a sewing needle. No microscope or crimper.</text>
</svg>
