  <rect x="321.9" y="686" width="70.3" height="74.1" rx="26.6" fill="#3b3226" stroke="#6b5a3a" stroke-width="2"/>
  <text x="243" y="818" class="label" text-anchor="middle">1  +  red</text>
  <text x="357" y="818" class="label" text-anchor="middle">2  -</text>
  <text x="55" y="852" class="note">Cavity 1 is the LEFT hole. 1.2 mm between centres.</text>
  <rect x="595" y="565" width="575" height="300" rx="16" fill="#f4f7fa"/>
  <text x="620" y="603" class="label">C. Pre-crimped contact (SACHL-003G-P0.2)</text>
