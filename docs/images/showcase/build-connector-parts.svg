<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
  <title id="title">Know the speaker-plug parts and which face is which</title>
  <desc id="desc">Panel A: a three-dimensional drawing of the ACHLR-02V-S plug housing. Its flat face has two holes where the contacts go in; the opposite rough end has the latch and mating features and is never used for insertion. A triangle on the top face marks cavity 1 (VO plus, red lead) and a 2 marks cavity 2 (VO minus). The top face points away from the board when plugged in. Panel B: looking straight into the holes with the triangle face up, cavity 1 is the left hole; the holes are 1.2 mm apart. Panel C: a factory-crimped SACHL contact, 3.2 mm long, gripped at the base of its metal crimp; the spring box at the front goes in first. Panel D: tools. Drawn from JST's published outline dimensions, simplified; not a manufacturer drawing.</desc>
