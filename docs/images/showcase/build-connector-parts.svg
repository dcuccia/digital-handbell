  <text x="793.9" y="252.8" text-anchor="middle" style="font-size:27.2px;font-weight:bold">2</text>
  <path d="M330 215 L584.1 293.6" stroke="#8a3b12" stroke-width="2"/><circle cx="584.1" cy="293.6" r="4" fill="#8a3b12"/>
  <text x="55" y="200" class="call">Triangle on top = cavity 1</text>
  <text x="55" y="226" class="call">= VO+ (red lead)</text>
  <path d="M330 470 L626.8 378.9" stroke="#8a3b12" stroke-width="2"/><circle cx="626.8" cy="378.9" r="4" fill="#8a3b12"/>
  <text x="55" y="465" class="call">FLAT face, two holes:</text>
  <text x="55" y="491" class="call">contacts go in here</text>
  <path d="M880 222 L812.3 251" stroke="#8a3b12" stroke-width="2"/><circle cx="812.3" cy="251" r="4" fill="#8a3b12"/>
  <text x="886" y="228" class="call">"2" = cavity 2 = VO-</text>
  <path d="M880 380 L799.8 241.2" stroke="#8a3b12" stroke-width="2"/><circle cx="799.8" cy="241.2" r="4" fill="#8a3b12"/>
  <text x="886" y="375" class="call">ROUGH end: latch and</text>
  <text x="886" y="401" class="call">mating features.</text>
  <text x="886" y="427" class="call">Never insert here.</text>
  <text x="55" y="528" class="note">Top face points AWAY from the board when plugged in; the wires then lie along the board.</text>
  <rect x="30" y="565" width="545" height="300" rx="16" fill="#f4f7fa"/>
